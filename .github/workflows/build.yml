name: 'Upstream source check'

# main is reserved for updating the project code; it must never publish the
# personal site. Only the separate website branch deploys to gh-pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
      - name: Validate generated site (do not deploy)
        run: bundle exec ruby ./scaffold.rb
